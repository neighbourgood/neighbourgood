# Publishes the backend and frontend images to GitHub's container registry,
# so servers pull ready-made images instead of building them (the frontend
# build alone needs about 1 GB of memory).
#
# Runs when a version tag is pushed:
#   git tag v2.10.0 && git push origin v2.10.0
# and produces ghcr.io/neighbourgood/neighbourgood-{backend,frontend} tagged
# 2.10.0, 2.10 and latest, for amd64 and arm64 (Raspberry Pi, ARM VPSes).
name: Publish Docker images

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # arm64 images are built under emulation on the amd64 runner
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/neighbourgood-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
